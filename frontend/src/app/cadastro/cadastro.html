<h2>Criar conta</h2>

<form>
    <div>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="nome" placeholder="Digite seu nome" >
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu email"> 
    </div>

</form>
