
<div class="auth-container">
  <div class="auth-card">

    <h1 class="auth-title">Criar conta</h1>

    <form class="auth-form" #formulario="ngForm" (ngSubmit)="cadastrar()">

      <div class="form-group">
        <label class="form-label" for="nome">Nome completo</label>
        <input class="form-input" type="text" id="nome" name="nome"
          [(ngModel)]="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email"
          [(ngModel)]="email" placeholder="Digite seu email" required email>
      </div>

      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-input" type="password" id="senha" name="senha"
          [(ngModel)]="senha" placeholder="Digite sua senha" required minlength="8">
      </div>

      <div class="form-group">
        <label class="form-label" for="telefone">Telefone</label>
        <input class="form-input" type="tel" id="telefone" name="telefone"
          [(ngModel)]="telefone" placeholder="Digite seu telefone" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="dataNascimento">Data de Nascimento</label>
        <input class="form-input" type="date" id="dataNascimento"
          name="dataNascimento" [(ngModel)]="dataNascimento" required>
      </div>

      <button class="auth-button" type="submit" [disabled]="formulario.invalid">
        Cadastrar
      </button>

      <a class="auth-link" routerLink="/login">
        Já tem uma conta? Entrar
      </a>

    </form>
  </div>
</div>
