<h2>Criar conta</h2>

<form #formulario="ngForm" (ngSubmit)="cadastrar()">
    <div>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="nome" placeholder="Digite seu nome" required>
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu email" required email> 
    </div>

    <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" [(ngModel)]="senha" placeholder="Digite sua senha" required minlength="8"> 
    </div>

    <div>
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" [(ngModel)]="telefone" placeholder="Digite seu telefone" required > 
    </div>

    <div>
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" name="dataNascimento" [(ngModel)]="dataNascimento" required> 
    </div>

    <button type="submit" [disabled]="formulario.invalid">Cadastrar</button>
    <a routerLink="/login">Ja tem uma conta? Entrar</a>
</form>
